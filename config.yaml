# Strategic Board Game Configuration

# Data Collection Settings
data:
  file_name: "game_data.csv"
  num_games: 200000
  save_interval: 50 # Save to file every N games

# Model Architecture
model:
  input_size: 49
  # Deeper and wider network to capture complex patterns
  hidden_layers: [256, 128, 64, 32]
  output_size: 1

# Training Hyperparameters
training:
  epochs: 100
  # Larger batch size for stable gradient estimates and faster GPU training
  batch_size: 256
  learning_rate: 0.001
  device: "cuda"  # Options: "cuda", "cpu", or "auto"

# File Paths
paths:
  model_checkpoint: "ai_brain.pth"
  training_checkpoint: "checkpoint.pth"
